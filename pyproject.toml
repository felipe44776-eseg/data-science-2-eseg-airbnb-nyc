[project]
name = "airbnb-nyc-eseg"
version = "0.1.0"
description = "Data Science 2 - Airbnb em Nova York 2019 -> 2026: CRISP-DM, dados externos e previsao"
requires-python = ">=3.11"

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-q"
markers = [
    "dados: exige o dado real em data/ (pulado quando ausente, como no CI)",
    "node: exige Node 18+ no PATH (paridade Python <-> JavaScript)",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["E501"]
