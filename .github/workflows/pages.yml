name: pages

# Publica em https://felipe44776-eseg.github.io/data-science-2-eseg-airbnb-nyc/
#   /        -> portal do projeto
#   /mapa/   -> mapa + teste de localizacao
#   /apresentacao/ -> deck de 20 slides
#   /docs/   -> documentacao MkDocs (docs/)
#
# Os DADOS do site (site/data/*.json) nao sao gerados aqui: vem do pipeline local
# (`.\tasks.ps1 all`), sao versionados e so publicados. Gerar aqui exigiria baixar
# e reprocessar todas as fontes a cada push — e publicar o que foi verificado
# localmente e mais honesto do que fingir que o CI reproduz (ADR 0003).

on:
  push:
    branches: [main]
    paths:
      - 'site/**'
      - 'docs/**'
      - 'mkdocs.yml'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# uma publicacao por vez; nao cancela a que ja esta rodando
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  publicar:
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: instalar mkdocs
        run: pip install mkdocs==1.6.1 mkdocs-material==9.7.7 pymdown-extensions==12.0.1

      # nao publica um modelo que diverge do Python
      - name: paridade do modelo publicado
        run: |
          node tests/paridade_js.mjs site/data/modelo_preco.json site/data/_casos_paridade_preco.json
          node tests/paridade_js.mjs site/data/modelo_ocupacao.json site/data/_casos_paridade_ocupacao.json

      - name: montar o site
        run: |
          set -euo pipefail
          mkdir -p _site
          cp -r site/* _site/
          mkdocs build --strict --site-dir _site/docs
          # sem isto o Jekyll do Pages ignora arquivos iniciados por _
          touch _site/.nojekyll
          echo "--- publicado ---"
          find _site -maxdepth 2 -type f | sort | head -50
          du -sh _site _site/data

      - name: conferir que nada ficou vazio nem provisorio
        run: |
          set -euo pipefail
          for f in _site/index.html _site/mapa/index.html _site/apresentacao/index.html _site/docs/index.html _site/data/resumo.json _site/data/modelo_preco.json _site/data/celulas_r8.json _site/data/celulas_r9.json; do
            test -s "$f" || { echo "vazio ou ausente: $f"; exit 1; }
          done
          # o gate anterior procurava '"provisorio": true' em site/data — chave que
          # NENHUM modulo do pipeline jamais escreveu: nunca podia disparar. A
          # concordancia entre as superficies e o pipeline agora e testada de
          # verdade em tests/test_superficies.py, que roda no ci.yml. Aqui fica
          # so o resto de andaime, que ja foi removido e nao pode voltar.
          if grep -rl 'Dados provisórios' _site --include='*.html'; then
            echo "uma pagina publicada ainda anuncia dado provisorio"
            exit 1
          fi

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deploy
        uses: actions/deploy-pages@v4
